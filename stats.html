<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BombGuard — Stats</title>
  <link rel="stylesheet" href="/theme.css">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header img {
      width: 64px;
      margin-bottom: 0.75rem;
    }

    header h1 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 2rem;
      color: var(--accent-primary);
      letter-spacing: 2px;
    }

    header p {
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-top: 0.25rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      max-width: 700px;
      margin: 0 auto 2.5rem;
    }

    .card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem 1rem;
      text-align: center;
    }

    .card .number {
      font-family: 'Rajdhani', sans-serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: var(--accent-secondary);
      line-height: 1;
    }

    .card .label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card.blue .number { color: var(--accent-primary); }

    .section-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.1rem;
      color: var(--text-secondary);
      letter-spacing: 2px;
      text-transform: uppercase;
      max-width: 700px;
      margin: 0 auto 0.75rem;
      padding-left: 0.25rem;
    }

    .table-wrap {
      max-width: 700px;
      margin: 0 auto 2rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th {
      background: var(--bg-base);
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.75rem;
      padding: 0.75rem 1rem;
      text-align: left;
    }

    td {
      padding: 0.7rem 1rem;
      border-top: 1px solid var(--border-glass);
      color: var(--text-primary);
      white-space: nowrap;
    }

    tr:hover td { background: var(--surface-tint); }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge.install { background: rgba(255, 179, 71, 0.15); color: var(--accent-secondary); }
    .badge.visit   { background: rgba(74, 159, 212, 0.15); color: var(--accent-primary); }
    .badge.ios     { background: var(--border-glass); color: var(--text-primary); }
    .badge.android { background: rgba(46, 204, 113, 0.15); color: var(--success); }
    .badge.desktop { background: var(--surface-tint); color: var(--text-secondary); }

    .loading { text-align: center; color: var(--text-secondary); padding: 3rem; }
    .bone {
      display: inline-block;
      border-radius: 6px;
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.12) 45%, rgba(255,255,255,0.05) 65%);
      background-size: 300% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
    }
    .skeleton-rows { display: grid; gap: 12px; padding: 1.25rem; }
    .skeleton-rows .bone { height: 18px; }
    @keyframes shimmer {
      from { background-position: 100% 0; }
      to { background-position: 0 0; }
    }
    .error-state { text-align: center; color: var(--text-secondary); padding: 2.5rem 1rem; }
    .error-state strong { display: block; color: var(--text-primary); margin-bottom: 0.25rem; }
    @media (prefers-reduced-motion: reduce) {
      .bone { animation: none; }
    }
    .refresh-btn {
      display: block;
      margin: 0 auto;
      background: var(--accent-primary);
      color: var(--bg-base);
      border: none;
      border-radius: var(--radius-sm);
      padding: 0.6rem 1.5rem;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .refresh-btn:hover { background: var(--accent-primary-hover); }
  </style>
</head>
<body>

<header>
  <img src="/icon.png" alt="BombGuard">
  <h1>BOMBGUARD STATS</h1>
  <p id="last-updated">Loading...</p>
</header>

<div class="grid">
  <div class="card">
    <div class="number" id="total-visits">—</div>
    <div class="label">Total Visits</div>
  </div>
  <div class="card blue">
    <div class="number" id="total-installs">—</div>
    <div class="label">Total Installs</div>
  </div>
  <div class="card">
    <div class="number" id="visits-today">—</div>
    <div class="label">Visits Today</div>
  </div>
  <div class="card blue">
    <div class="number" id="installs-today">—</div>
    <div class="label">Installs Today</div>
  </div>
</div>

<p class="section-title">Recent Events</p>
<div class="table-wrap">
  <div class="loading skeleton-rows" id="table-loading" aria-busy="true" aria-label="Loading events">
    <span class="bone" style="width: 92%"></span>
    <span class="bone" style="width: 78%"></span>
    <span class="bone" style="width: 86%"></span>
    <span class="bone" style="width: 70%"></span>
    <span class="bone" style="width: 82%"></span>
  </div>
  <table id="events-table" style="display:none">
    <thead>
      <tr>
        <th>Type</th>
        <th>Platform</th>
        <th>Location</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody id="events-body"></tbody>
  </table>
</div>

<button class="refresh-btn" onclick="loadStats()">Refresh</button>

<script>
  const SUPABASE_URL = 'https://mgalwgarvsjgalaqyeok.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1nYWx3Z2FydnNqZ2FsYXF5ZW9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3ODkzNDcsImV4cCI6MjA5MTM2NTM0N30.Bc6WoDPYhNQjwlXtFTJQEGxaVsOXwzEpbddW_pJZFNU';

  async function query(params) {
    const url = new URL(`${SUPABASE_URL}/rest/v1/app_events`);
    Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
    const res = await fetch(url, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    if (!res.ok) throw new Error(`Stats request failed (${res.status})`);
    return res.json();
  }

  // Event fields are visitor-supplied (platform, city, country), so escape them
  // before they go into innerHTML.
  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }

  // Badge class names come from a fixed allowlist, never from the data itself.
  const EVENT_TYPES = ['visit', 'install'];
  const PLATFORMS = ['ios', 'android', 'desktop'];

  const NUMBER_IDS = ['total-visits', 'total-installs', 'visits-today', 'installs-today'];
  function showNumberSkeletons() {
    NUMBER_IDS.forEach(id => {
      document.getElementById(id).innerHTML = '<span class="bone" style="width: 3.5rem; height: 2rem; vertical-align: middle"></span>';
    });
  }

  function formatTime(iso) {
    const d = new Date(iso);
    return d.toLocaleString();
  }

  function todayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  async function loadStats() {
    document.getElementById('last-updated').textContent = 'Refreshing...';
    showNumberSkeletons();

    let all, recent;
    try {
      [all, recent] = await Promise.all([
        query({ select: 'event_type,created_at', order: 'created_at.desc' }),
        query({ select: 'event_type,platform,country,city,created_at', order: 'created_at.desc', limit: 50 })
      ]);
    } catch (err) {
      console.error('[BombGuard stats]', err);
      NUMBER_IDS.forEach(id => { document.getElementById(id).textContent = '—'; });
      document.getElementById('events-table').style.display = 'none';
      const box = document.getElementById('table-loading');
      box.style.display = 'block';
      box.className = 'error-state';
      box.removeAttribute('aria-busy');
      box.innerHTML = '<strong>Couldn\'t load stats</strong>Check your connection, then hit Refresh.';
      document.getElementById('last-updated').textContent = 'Last refresh failed';
      return;
    }

    const today = todayISO();
    let visits = 0, installs = 0, visitsToday = 0, installsToday = 0;

    all.forEach(e => {
      const isToday = e.created_at.startsWith(today);
      if (e.event_type === 'visit')   { visits++;   if (isToday) visitsToday++; }
      if (e.event_type === 'install') { installs++; if (isToday) installsToday++; }
    });

    document.getElementById('total-visits').textContent   = visits.toLocaleString();
    document.getElementById('total-installs').textContent = installs.toLocaleString();
    document.getElementById('visits-today').textContent   = visitsToday.toLocaleString();
    document.getElementById('installs-today').textContent = installsToday.toLocaleString();

    const tbody = document.getElementById('events-body');
    tbody.innerHTML = recent.map(e => {
      const type = EVENT_TYPES.includes(e.event_type) ? e.event_type : '';
      const platform = PLATFORMS.includes(e.platform) ? e.platform : 'desktop';
      const place = e.city && e.country ? `${e.city}, ${e.country}` : e.country || '—';
      return `
      <tr>
        <td><span class="badge ${type}">${esc(e.event_type)}</span></td>
        <td><span class="badge ${platform}">${esc(e.platform || 'desktop')}</span></td>
        <td>${esc(place)}</td>
        <td>${esc(formatTime(e.created_at))}</td>
      </tr>`;
    }).join('');

    document.getElementById('table-loading').style.display = 'none';
    document.getElementById('events-table').style.display = 'table';
    document.getElementById('last-updated').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
  }

  loadStats();
</script>
</body>
</html>
